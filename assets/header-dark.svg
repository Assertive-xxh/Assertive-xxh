  </g>

  <line x1="420" y1="40" x2="420" y2="190" stroke="#3d444d"/>

  <g class="mono">
    <text x="448" y="62"><tspan class="p">~ $</tspan><tspan x="484" class="v">whoami</tspan></text>
    <text x="448" y="92"><tspan class="k">focus</tspan><tspan x="528" class="v">llm agents · dev tools · data libs</tspan></text>
    <text x="448" y="116"><tspan class="k">merged</tspan><tspan x="528" class="v">floci · ag2 · teamai-cli</tspan></text>
    <text x="448" y="140"><tspan x="528" class="v">quarkus-langchain4j</tspan></text>
