<svg xmlns="http://www.w3.org/2000/svg" width="846" height="230" viewBox="0 0 846 230" role="img" aria-labelledby="t d">
  <title id="t">Yang Hao</title>
  <desc id="d">Software developer exploring LLM agents, developer tools and data libraries.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .name { font-size: 32px; font-weight: 600; fill: #f0f6fc; }
    .tag  { font-size: 15px; fill: #9198a1; }
    .chip { font-size: 12px; fill: #f0f6fc; }
    .k    { font-size: 13px; fill: #9198a1; }
    .v    { font-size: 13px; fill: #f0f6fc; }
    .p    { font-size: 13px; fill: #4493f8; }
  </style>
  <rect x="0.5" y="0.5" width="845" height="229" rx="12" fill="#151b23" stroke="#3d444d"/>

  <text x="40" y="84" class="sans name">Yang Hao</text>
  <text x="40" y="118" class="sans tag">Exploring LLM agents, developer tools and</text>
  <text x="40" y="140" class="sans tag">data libraries, then building with them.</text>

  <g class="mono">
    <rect x="40" y="166" width="50" height="26" rx="13" fill="#212830" stroke="#3d444d"/>
    <text x="65" y="183" class="chip" text-anchor="middle">Java</text>
    <rect x="98" y="166" width="64" height="26" rx="13" fill="#212830" stroke="#3d444d"/>
    <text x="130" y="183" class="chip" text-anchor="middle">Python</text>
    <rect x="170" y="166" width="36" height="26" rx="13" fill="#212830" stroke="#3d444d"/>
    <text x="188" y="183" class="chip" text-anchor="middle">Go</text>
    <rect x="214" y="166" width="92" height="26" rx="13" fill="#212830" stroke="#3d444d"/>
